name: prueba ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    name: validar código
    runs-on: ubuntu-latest

    steps:
      - name: clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar node job
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: validar codigo HTML
        run: |
          echo "inicio"
          npx html-validate "**/*.html"
          echo "fin"
    



      
